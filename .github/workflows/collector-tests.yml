name: Collector tests

on:
  push:
    paths:
      - 'collector/**'
      - '.github/workflows/collector-tests.yml'
  pull_request:
    paths:
      - 'collector/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
