services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.7
    environment:
      CLICKHOUSE_DB: btc
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: localdev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./collector/clickhouse/init.sql:/docker-entrypoint-initdb.d/001_btc.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password localdev --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30

  collector:
    build:
      context: ./collector
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: localdev
      CLICKHOUSE_DB: btc
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      BOOK_SAMPLE_MS: 1000
      STATE_INTERVAL_MS: 1000
      REST_POLL_MS: 5000
      SUPABASE_INTERVAL_MS: 60000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  redis-data:
  clickhouse-data:
